# What has happened upstream that is not here yet.
#
# HexDeck is a declared fork of nexdeck and keeps taking its engine work over
# (the TrueNAS rework of 0.16.1 came that way). Nothing in here merges or
# cherry-picks anything: it opens one issue and keeps it up to date, so the
# decision stays a decision.
#
# ⚠️ The split in the report is the whole point. The ~140 adapters upstream
# owns are ours to take as they come; the files this fork has rewritten are
# where a blind merge would undo work. The second list is the one to read.
name: Upstream

on:
  schedule:
    # Monday morning, early enough that it is waiting rather than interrupting.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  behind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What upstream has that we do not
        id: look
        env:
          UPSTREAM: https://github.com/DerKezorm/nexdeck.git
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --quiet upstream main

          # Commits upstream has that are not in our history, newest first.
          git log --no-merges --format='- %h %s' HEAD..upstream/main > /tmp/commits.txt || true
          COUNT=$(wc -l < /tmp/commits.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing upstream that is not here."
            exit 0
          fi

          # Which files those commits touch, split by whether this fork has
          # rewritten them. Everything that is not an adapter we own, plus the
          # two adapters we do own, needs reading before it is taken.
          git diff --name-only HEAD..upstream/main > /tmp/files.txt || true
          grep -E '^backend/app/adapters/' /tmp/files.txt \
            | grep -vE '^backend/app/adapters/(github|truenas|core|notepad|projects|publicip|minecraft|steam|shelly|elasticsearch|urbackup|openwrt|kubernetes|amp|proxmenux|netbird)\.py$' \
            > /tmp/theirs.txt || true
          grep -vE '^backend/app/adapters/' /tmp/files.txt > /tmp/ours.txt || true
          grep -E '^backend/app/adapters/(github|truenas|core|notepad|projects|publicip|minecraft|steam|shelly|elasticsearch|urbackup|openwrt|kubernetes|amp|proxmenux|netbird)\.py$' /tmp/files.txt \
            >> /tmp/ours.txt || true

          UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "none")
          {
            echo "Upstream (\`DerKezorm/nexdeck\`) has **$COUNT commits** this fork does not, newest upstream tag \`$UPSTREAM_TAG\`."
            echo
            echo "### Adapters upstream owns"
            echo
            echo "These are files this fork does not touch, so they come over as they are."
            echo
            if [ -s /tmp/theirs.txt ]; then sed 's/^/- `/; s/$/`/' /tmp/theirs.txt; else echo "_None._"; fi
            echo
            echo "### Files this fork has its own version of"
            echo
            echo "Read these before taking anything: a merge here can undo work."
            echo
            if [ -s /tmp/ours.txt ]; then sed 's/^/- `/; s/$/`/' /tmp/ours.txt | head -60; else echo "_None._"; fi
            echo
            echo "### The commits"
            echo
            head -60 /tmp/commits.txt
            echo
            echo "---"
            echo
            echo "To look at one: \`git fetch upstream main && git show <hash>\`."
            echo "To take a single file: \`git checkout upstream/main -- <path>\`, then run the guards."
            echo "Updated by the Upstream workflow; it edits this issue rather than opening another."
          } > /tmp/body.md

      - name: Open or update the one issue
        if: steps.look.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Upstream: commits not in this fork"
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/body.md
            echo "Updated issue #$EXISTING."
          else
            gh issue create --title "$TITLE" --body-file /tmp/body.md --label upstream 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file /tmp/body.md
          fi
